<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <title>Arrastra y Arma la Cita</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Arma la Cita Correcta</h1>
    <div class="format-indicator" id="formatDisplay"></div>
    <div class="game-area">
        <div class="draggable-container" id="draggableContainer"></div>
        <h2>Zona de Descarga</h2>
        <div class="dropzone" id="dropzone"></div>
        <div class="btn-group">
            <button onclick="checkAnswer()">Verificar</button>
            <button onclick="showAnswer()">Mostrar respuesta</button>
            <button onclick="loadCitation()">Siguiente</button>
            <button onclick="window.location.href='index.html'">Volver a la teoría</button>
        </div>
    <div class="feedback" id="feedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
